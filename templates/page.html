{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<article class="post">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
