{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<article class="post post--article">
  <header class="page-header">
    <time class="section-kicker" datetime="{{ page.date }}">{{ page.date }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
