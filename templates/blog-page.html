{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<article class="page container">
  <header class="page-head">
    <time class="post-meta" datetime="{{ page.date }}">{{ page.date | date(format="%d %B %Y") }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
